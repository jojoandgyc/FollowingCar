[modules]
# 当前主流程：
#   vision/ReID/IdentityBank 负责“跟谁”；视觉横向位置负责“往哪边修正”；
#   distance.source 负责“前进基础速度”；前红外负责最后硬停兜底。
# 当前实车策略：Astra 深度相机提供目标距离，红外只负责急停兜底；
# 超声波和毫米波不参与运行时控制。
vision = true
ir = true
mmwave = false
astra_depth = true
ultrasonic = false
imu = true
bunker = false

[ir]
backend = iio
# 当前板子实测：trigger_value=0 表示红外触发/有遮挡，1 表示未触发。
# 当前板子 IIO 映射对齐 /home/topeet/Desktop/followme/read_ir_sr04_fast.py：
# right=device4, left=device3, front=device5。
# 前红外始终是硬停安全条件；左右红外是否限制转向由 [safety].side_ir_blocks_rotation 控制。
host = 192.168.33.103
port = 8888
timeout_sec = 0.25
cache_sec = 0.05
stale_sec = 0.50
trigger_value = 0
iio_base_dir = /sys/bus/iio/devices
iio_right_device = 4
iio_left_device = 3
iio_front_device = 5
raw_log_enable = true
raw_log_every_sec = 0.50

[mmwave]
# AT2410 24GHz FMCW radar.  Enable with [modules] mmwave=true and prefer
# [distance] source=vision_mmwave so radar distance is matched to the locked
# visual person instead of driving from unrelated radar points.
backend = at2410
# Default AT2410 node. Override all runtime users with MMWAVE_AT2410_PORT.
port = /dev/serial/by-id/usb-SIPEED_UARTx4_HS_FactoryAIOT_Prog_Serial-if00
baudrate = 9600
read_timeout_sec = 0.04
read_size = 256
verify_timeout_sec = 20.0
# SIPEED UARTx4 only remains reliable here when reset is followed immediately
# by one long-lived O_RDWR descriptor. The runtime verifies a frame and then
# keeps that same descriptor for the asynchronous radar reader.
verify_on_init = true
usb_reset_on_init = true
usb_reset_attempts = 3
usb_id = 359f:3101
usb_reconnect_timeout_sec = 8.0
target_limit = 3
target_mode = angle
front_angle_deg = 60
distance_bias_m = 0.0
min_distance_m = 0.50
max_distance_m = 10.0
min_output_distance_m = 0.03
stale_hold_sec = 0.35
conservative_window_sec = 0.60
# 后台持续读取毫米波，控制循环只取缓存，避免 UART 读取阻塞视觉决策。
async_cache_enable = true
cache_interval_sec = 0.04
cache_window_sec = 0.80

[astra_depth]
# OpenNI opens Astra RGB and Depth together so hardware registration can map
# every depth pixel into the RGB image used by YOLO/ReID.
openni_path = /home/topeet/AstraSDK/arm64_openni2
width = 640
height = 480
fps = 30
min_distance_m = 0.35
max_distance_m = 8.0
max_frame_age_sec = 0.25
hold_sec = 0.20
# RGB/Depth 软件对齐暂取 50ms；实际流周期、样本年龄和流水线耗时会分别写入日志。
rgb_processing_delay_sec = 0.05
roi_left_ratio = 0.32
roi_right_ratio = 0.68
roi_top_ratio = 0.22
roi_bottom_ratio = 0.68
# Visible torso ROI uses a proportional requirement. The legacy fixed value is
# retained only for compatibility with old tools; runtime selection uses max(20, area*3%).
min_valid_pixels = 80
dynamic_min_valid_floor = 20
dynamic_min_valid_fraction = 0.03
# 最多取最近3个已接受Depth样本；同时按anchor_strict_age_sec淘汰旧样本
# （窗口时间不短于max_frame_age_sec），恢复时不混入几秒前的距离。
median_window = 3
# Sample chest, abdomen, left/right torso and lower abdomen independently,
# then select a spatially coherent depth surface across those regions.
foreground_cluster_span_m = 0.40
foreground_cluster_min_fraction = 0.03
foreground_spatial_support_fraction = 0.55
torso_region_min_size_px = 16
torso_region_max_size_px = 64
# 人物框已占画面较大面积时，明显远距离不可能属于该人物，禁止作为首次测距。
large_bbox_guard_area_ratio = 0.35
large_bbox_guard_height_ratio = 0.90
large_bbox_guard_max_distance_m = 2.50
# 仅脚部贴底、非大框且完整躯干1～2区时，可走有界两帧恢复：
# 距离<=3m、与原锚点相差<=0.6m、锚点<=3s；不豁免下腹/腿缝远背景。
# 确认后每个连续新Depth可更新，旧/重复帧不能累计或伪造三区域证明。
max_distance_jump_m = 0.80
jump_confirm_frames = 2
# Reject near-to-far jumps above this relative rate unless encoder motion
# supports the vehicle movement; stale/background returns remain held.
max_unconfirmed_jump_rate_m_s = 3.0
# 已确认近距离人物后，远距离跳变需要更长确认，并要求人物框缩小且没有水平贴边。
near_guard_distance_m = 1.80
near_far_jump_confirm_frames = 5
# Old range anchors lose authority with age: strict 5-frame protection below
# 0.6s, 3-frame confirmation to 1.5s, then a new 3-frame anchor is established.
anchor_strict_age_sec = 0.60
anchor_expire_age_sec = 1.50
reanchor_confirm_frames = 3
motion_confirm_frames = 3
motion_reverse_min_m = 0.08
near_far_jump_max_bbox_ratio = 0.90
near_far_jump_edge_margin_ratio = 0.02
log_every_sec = 1.0
# 普通ROI仍为180ms；180~250ms仅在可信新鲜编码器角速度<=5deg/s时取新Depth。
# 所有动作仍进入原latest-action队列，禁止另开电机写线程。
longitudinal_control_enable = true
longitudinal_control_hz = 30.0
longitudinal_bbox_max_age_sec = 0.25
# 前进原授权最多保留到物理Depth采集后250ms，独立于ROI框年龄。
# 180~250ms仅同UID、可见、无危险且制动余量充分时维持/降速；不首启、不积分、不续期。
# 新前进授权与倒车仍要求样本<=180ms；处理/重复时间不能刷新原期限。
longitudinal_sample_max_age_sec = 0.25
# Stage-2 low-speed guard for Depth longitudinal assistance. This cap is
# independent of the global follow speed limit. It is ramped toward the far
# cap only when the canonical, depth-gated target distance is far away.
# 10% of the 200RPM forward scale = the existing 20RPM near-distance limit.
longitudinal_max_forward_percent = 10
longitudinal_far_distance_m = 2.20
# Only the ceiling grows. Current PID/FF request and acceleration limits still apply.
longitudinal_far_forward_percent = 100

[ultrasonic]
# Disabled in the current depth-camera + IR runtime. The values below are
# retained for compatibility with older configurations.
backend = iio
iio_base_dir = /sys/bus/iio/devices
iio_device = 2
iio_device_name = hcsr04
min_distance_m = 0.02
max_distance_m = 8.0
# SR04 在车体/地面反射下会偶发跳近。这里先做轻量防抖：
# - filter_window 使用中值滤波；
# - *_confirm_frames 要连续看到近距离才进入距离停；
# - hysteresis_m 让恢复前进需要明显离开停距，避免 1.45/1.55m 来回抖；
# - immediate_brake_m 是极近兜底，低于该值仍立即刹车。
filter_window = 3
target_confirm_frames = 2
brake_confirm_frames = 2
hysteresis_m = 0.25
immediate_brake_m = 0.35

[imu]
# ICM20600 accel + gyro.  This module is evidence/logging only for now; it does
# not affect steering/braking decisions until the vehicle-axis mapping is tested.
backend = icm20600
fail_soft = true
enable_on_init = true
disable_on_deinit = false
log_enable = true
log_every_sec = 0.50
event_base_dir = /dev/input
sys_input_base_dir = /sys/class/input
accel_name = gsensor
gyro_name = gyro
accel_event =
gyro_event =
accel_misc_dev = /dev/mma8452_daemon
gyro_misc_dev = /dev/gyrosensor
accel_rate_ms = 30
gyro_rate_ms = 30
accel_lsb_per_g = 16384.0
gyro_lsb_per_dps = 16.4

[vision]
# 实测正常帧偶尔达到 156~181ms；180ms 会丢掉仍有完整人物框的关键方向帧。
# 只放宽到190ms，避免把更旧的视觉结果用于运动控制。
control_max_result_age_sec = 0.19
# RK3588 使用 RKNN Runtime。摄像头读取不在这里打开，外部代码通过
# PersonTracker.process_external_frame(frame, frame_format="BGR") 传入图像。
engine = rknn
reid_enable = true
model_path = models/yolo11n_int8_person_val2017.rknn
reid_model_path = models/osnet_x0_25_msmt17_b1.rknn
rknn_target = rk3588
rknn_core_mask = auto
rknn_backend = auto
input_size = 640
num_classes = 80
nms_threshold = 0.45
yolo_box_format = xywh
yolo_input_format = RGB
reid_input_width = 128
reid_input_height = 256
reid_input_format = RGB
reid_input_dtype = float32
reid_input_layout = NCHW
reid_normalize = imagenet
# OSNet 主特征之外加入轻量 HSV 躯干颜色特征，避免仅凭外观形状误接路人。
reid_color_fusion_enable = true
reid_color_fusion_weight = 0.35
# 目标贴近/出框时额外提取中央躯干外观描述；不改变全身 ReID 阈值。
reid_partial_appearance_enable = true
# 使用同一 OSNet 对躯干 ROI 单独推理，partial gallery 与全身 gallery 分开。
# 每个检测会增加一次 ReID 推理；设为 false 才回退到旧直方图特征。
reid_partial_osnet_enable = true
# Save exact ReID crops and template provenance without blocking vision.
reid_diagnostics_enable = true
reid_diagnostics_max_samples = 2000
reid_diagnostics_queue_capacity = 16
reid_diagnostics_mapped_interval = 30
track_log_enable = true
track_log_empty_every = 20
# 实时控制只使用当前帧真实更新的 track。DeepSORT 补帧框(time_since_update>0)
# 可用于离线分析/日志，但不进入小车动作决策，避免旧框造成滞后或误 stop。
control_use_predicted_tracks = false
# 基础运行阶段不使用 ReID 缺失时的几何临时 UID；未确认目标必须等待正式 ReID。
single_person_geometry_fallback_enable = false
single_person_geometry_confirm_frames = 2
single_person_geometry_max_gap_frames = 5
single_person_geometry_min_iou = 0.35
single_person_geometry_max_center_jump_ratio = 0.22
# 低质量框不参与 ReID、Depth 和纵向控制，但其当前左右位置仍用于
# 有界横向修正；搜索中也先暂停 18RPM 盲转，再以 4~6RPM 对准该框。
visible_low_quality_steer_max_correction_rpm = 6.0
visible_low_quality_steer_edge_max_correction_rpm = 12.0
frame_width = 640
frame_height = 480
hfov_deg = 60.0
# 算法实际输出 track 的估计 FPS，不是摄像头 FPS；用于根据 tracker max_unmatched_num 推导 Python 换人保护时间。
effective_fps = 3.3
person_class_id = 0
confidence_threshold = 0.25
# 仅在完全丢失后的搜索阶段记录0.10以上疑似人体；不进入Track、ReID或电机控制。
search_diagnostic_conf_threshold = 0.10
# 搜索阶段低置信人体框先按空间重叠聚类，避免一人被解码成多个碎框。
# 这些设置只影响搜索证据和叠加显示，不改变正式 YOLO 检测结果。
search_probe_cluster_enable = true
search_probe_cluster_iou_threshold = 0.45
search_probe_cluster_center_distance_ratio = 0.18
search_probe_cluster_min_score_gap = 0.03
target_select = largest_area

[camera]
enable = true
# Use the Astra UVC by-id link so unrelated USB device changes do not
# renumber the RGB stream away from the configured camera.
device = /dev/v4l/by-id/usb-Astra_Pro_HD_Camera_Astra_Pro_HD_Camera-video-index0
width = 640
height = 480
fps = 30.0
fourcc = YUYV
# Camera capture mode used by request_0513_modular.py:
#   gstreamer_mjpeg : default. GStreamer opens the MJPG camera stream and
#                     outputs decoded BGR frames to RKNN/ReID. This avoids the
#                     OpenCV V4L2 path and matches the recording pipeline.
#   opencv_v4l2     : fallback. Use the legacy cv2.VideoCapture(V4L2) camera
#                     path if GStreamer/PyGObject has trouble on a board image.
# request_0512_modular.py ignores capture_mode and keeps its legacy OpenCV path.
capture_mode = opencv_v4l2
# auto 会优先使用 Rockchip mppjpegdec 硬件 JPEG 解码；板子缺插件时回退 jpegdec。
jpeg_decoder = auto
# Save every control-loop camera frame by default. "auto" writes camera_raw.avi
# and camera_raw.frames.csv into the current run log directory.
raw_output = auto
retry_interval_sec = 2.0
# When inference is slower than the camera, drain already queued appsink frames
# and run RKNN on the newest one. 0 keeps legacy one-frame pull behavior.
latest_drain_max = 8

[distance]
# source:
#   none          : 不使用距离，看到人且前方安全时用 fallback_forward_percent 低速跟随。
#   ultrasonic    : 使用 RK3588 IIO hcsr04/SR04 距离作为前进控速输入。
#   vision_mmwave: 只有视觉锁到人后，按视觉目标角度匹配毫米波目标，再用匹配距离控速。
#   vision_depth  : 使用 Astra 深度相机对齐到目标框的距离。
# 摄像头始终负责认人、左右方向、居中微调和搜索方向；毫米波不能覆盖视觉决策。
# 不建议使用“纯毫米波跟随”，因为多人/柱子/鬼影会绕过视觉锁人逻辑。
source = vision_depth

# 当前实车只有三路红外能触发硬停车/刹车保持。Depth 距离只参与前进
# 速度 PID 和倒车：静止目标到设定距离时下发零速度，不进入距离停车锁存；
# 持续行走且速度证据可信时，允许在设定距离附近保持受限匹配速度。
parking_enable = false
# 跟随目标距离：主动维持 target_distance_m；超过后按连续距离 PID 追赶。
target_distance_m = 1.5
# 启用后只需修改 target_distance_m，其余距离回差和近距离保护自动派生。
# 如需逐项覆盖，可通过环境变量 FOLLOW_DISTANCE_AUTO_TUNE=0 关闭。
auto_tune_follow_distance = true
target_distance_release_m = 1.5
target_distance_release_hold_sec = 0.50
target_distance_release_confirm_frames = 3
# Depth 解锁还必须看到人物框明显缩小；人物框贴住左右边缘时禁止用背景远点解锁。
target_distance_release_visual_shrink_ratio = 0.90
target_distance_release_visual_edge_margin_ratio = 0.02

# 距离 PID 的近端参考值；当前不会触发 brake，红外才负责硬停。
brake_distance_m = 0.5

# 纵向距离回差测试区（自动模式下按 target_distance_m 派生）：
# - 静止时距离超过目标+0.08m 开始追赶，缩短到目标+0.03m 停止；
# - 只有目标+0.03m 内进入静止近距离旋转模式；
# - 连续可信 Depth+编码器确认目标仍在行走时，可在目标距离附近保持匹配速度；
# - 硬刹车仍只由红外触发。
forward_start_distance_m = 1.58
forward_stop_distance_m = 1.53
# 无可信行走速度证据、且在自动近距离阈值内时，只做原地横向修正。
near_distance_rotate_only_enable = true
near_distance_rotate_only_distance_m = 1.53
# 近距离原地跟随使用独立中低速上限。最新日志中目标误差常达 10~20 度，
# 8~10 RPM 长时间饱和导致回中滞后；先将正常近距离修正限制在 10 RPM，
# 搜索/重新捕获阶段仍使用独立的更高转速。
# PID 编码器内环、反向制动和换向斜率仍独立限幅，避免左右晃动时累积大角速度。
near_distance_rotation_only_max_rpm = 10
# 近距离目标进入中心后，连续确认低车体角速度才进入短暂零横向保持。
near_distance_settle_confirm_frames = 2
near_distance_settle_hold_sec = 0.35
near_distance_settle_release_margin_ratio = 0.03
near_distance_settle_release_frames = 2
# 近距离时不把人体框的图像速度作为转向前馈，避免把车体自身旋转放大成反向修正。
near_distance_disable_rate_feedforward = true

# 目标持续主动靠近时的距离闭环倒车（近距离旋转策略关闭时才生效）：
# - 当前接受锁定人物 ROI 内的实时稳定 Astra Depth；毫米波路径保留但禁用；
# - Depth hold/视觉丢失只退出倒车，不产生安全刹车保持；
# - 低于 1.30m 后需要连续2个新鲜Depth采样才启动倒车；
# - 恢复到 1.45m 后同样连续确认2次，才交回普通控制；
# - 倒车成立后至少 30 RPM，按目标接近速度增加；当前实车验证上限 60 RPM；
# - reverse_max_rpm=100 只保留为系统绝对上限，不会直接作为本轮测试转速；
# - 任一路红外触发仍会立即硬停。
reverse_enable = true
reverse_start_distance_m = 1.30
reverse_immediate_distance_m = 1.30
reverse_stop_distance_m = 1.45
reverse_full_speed_distance_m = 1.00
reverse_min_rpm = 20
reverse_max_rpm = 100
reverse_feedforward_floor_rpm = 30
reverse_feedforward_gain_rpm_per_m_s = 40.0
reverse_runtime_cap_rpm = 60
reverse_approach_speed_filter_alpha = 0.50
reverse_min_approach_delta_m = 0.03
reverse_confirm_frames = 2
reverse_radar_max_age_sec = 0.25
reverse_visual_guard_max_distance_m = 1.60

# 仅用于传统“前方毫米波障碍”判断；vision_mmwave 跟随时更推荐用角度匹配后的目标距离。
mmwave_obstacle_threshold_m = 1.0

# 没有可用距离时的基础前进速度。当前无毫米波测试阶段保持低速，避免红外异常时冲出去。
# vision_mmwave 模式没有有效毫米波距离时必须停车，不能盲目前进。
fallback_forward_percent = 0

[distance_pid]
# 正常前进使用距离 PI；人速估计仅诊断，独立制动/危险保护保持。
# 一次运行回退：FOLLOW_DISTANCE_CONTROL_MODE=approach 或 legacy。
control_mode = distance_pi
# CAP181/245响应试验：P由2.0提高50%到3.0；Ki/总上限/制动/期限不变。
# 这是距离追赶增益，不保证最终RPM提高50%；180请求和制动限幅可能遮盖P。
pi_kp_per_sec = 3.0
pi_ki_per_sec2 = 0.4
pi_integral_max_m_s = 0.8
pi_memory_sec = 0.35
# 变化率短暂未知时的运动证据记忆；不是Depth授权期限。0可回退。
pi_motion_memory_sec = 0.35
# 180RPM起步/追赶请求试验；0回退。只旁路合格前进的PI软件升速坡，
# 实际输出仍可被制动包络压到180以下/0，不改电机固件、倒车或授权期限。
pi_launch_request_rpm = 180
# 以下保留旧 approach 回退参数；显式 control_mode 优先于 approach_enable。
# distance_pi 不叠加下面的旧 P/I/D 或人速前馈；倒车仍使用原 PID。
# 0.40m/s² 是待实测的减速模型假设，不是硬件刹停能力保证；期限/危险保护不变。
approach_enable = true
# 人速仅作可选前馈；false 为纯距离对照，保留估计日志、独立制动和安全停车。
# 一次运行覆盖：FOLLOW_MATCHING_MODE=distance_only ./run_request_0428_modular.sh
approach_matching_enable = true
approach_gain_per_sec = 1.0
approach_max_catchup_m_s = 0.60
approach_deceleration_m_s2 = 0.40
approach_response_delay_sec = 0.20
# 无匹配人速时的距离追赶预算，不是人速估计或最低转速。
# 仅可信原始Depth短窗有效时使用；近距制动/正常加速/新控制180ms门仍优先。
approach_no_matching_max_rpm = 60.0
# 纵向串级外环：e = d_actual - d_target，输出带方向的目标轮速 RPM；
# LZ30EMA 驱动器内部编码器速度环作为内环。正误差前进，负误差倒车。
enable = true
kp_rpm_per_m = 24.0
ki_rpm_per_m_s = 0.8
kd_rpm_s_per_m = 2.0
integral_limit_m_s = 1.5
# Only positive distance error: Ki unchanged; max forward I = 0.8*7.5 = 6RPM.
# Reverse / target band retains the legacy 1.5 m*s limit (1.2RPM).
forward_integral_limit_m_s = 7.5
deadband_m = 0.03
# 使用同UID两次物理Depth采样及实测轮速估计目标速度；不使用保持/跳变样本。
# matching基速替代20RPM起步偏置；独立80RPM预算，不把额外前馈重复叠加。
# 深度预测与FF统一使用下方fusion_encoder_wheel_circumference_m；不改变电机RPM映射。
feedforward_enable = true
# Raw detector geometry + synchronized encoder: compensate camera Z rate for <=15deg/s turns.
turn_compensation_enable = true
# Only fresh same-UID depth after a short scheduling gap can resume from measured speed.
measured_recovery_enable = true
feedforward_max_rpm = 20.0
# >40RPM requires >=3 physical samples; rise 80RPM/s; only far non-closing falls are smoothed.
# 0 restores the legacy baseline+20RPM budget; forward grant TTL is configured above.
matching_base_max_rpm = 80.0
# Lower alpha gives a slower derivative estimate and rejects depth glitches.
derivative_filter_alpha = 0.12
# A person cannot move several metres between adjacent 30Hz depth decisions.
# Clamp such jumps before P/D calculation, then let the real reading converge.
max_measurement_jump_m = 0.80
# Smooth target wheel-speed changes caused by valid distance error changes.
output_rise_rpm_per_sec = 240.0
output_fall_rpm_per_sec = 300.0

[follow]
# 横向居中带。0.40~0.60 对移动人物过宽，日志中人已经明显横移时仍长期
# 输出 stop；收窄到 0.45~0.55，让近距离原地 PID 更早接管左右跟随。
center_left_ratio = 0.45
center_right_ratio = 0.55
center_deadzone_ratio = 0.05

# steer 回差。还没开始修正时，目标越过 enter 才进入左右转向；
# 已经在转向时，目标回到更窄的 release 中间带内才恢复直行，避免阈值附近来回抖。
steer_enter_left_ratio = 0.45
steer_enter_right_ratio = 0.55
# 已开始修方向后，回到 0.47~0.53 才释放；原地 rotate 同样使用这组回差。
steer_release_left_ratio = 0.47
steer_release_right_ratio = 0.53

# 这两个比例字段保留兼容旧配置。近距离原地修正现在由
# near_distance_rotation_only 分支触发，并复用摄像头/编码器 PID；普通可见目标
# 仍优先使用差速 steer，完全丢失后才进入 search rotate。
visible_rotate_left_ratio = 0.0
visible_rotate_right_ratio = 1.0

# 目前只按水平位置判断居中；开启 vertical gate 会要求目标也在垂直中心区域，容易误停。
use_vertical_center_gate = false

# 启动/手动清除目标后，默认原地等待视觉和 ReID 录入稳定目标，不主动左右旋转找人。
# search_before_first_person 仅保留给旧实验；设为 true 时才会使用 startup_search_delay_sec 后主动搜索。
search_before_first_person = false
startup_search_delay_sec = 0.0

# 目标确认丢失时先使用最后可信离开方向作为默认搜索方向，避免盲目反向。
# 搜索过程中若同一候选连续通过观察且有活动 UID 的强 ReID 证据，允许切换到候选所在侧；
# 普通检测框和低质量候选不能改变方向。编码器航向覆盖 360 度后仍未找回才退出。
# search_timeout_sec 仅在编码器反馈不可用或过期时作为保底。
search_timeout_sec = 5.0
search_timeout_exit_program = true
search_revolution_deg = 360.0
search_revolution_feedback_stale_sec = 0.80
exit_on_target_loss = false

# 第一次锁人前，同一个 ReID uid 需要连续稳定多少个决策帧才允许车辆开始跟随。
# 这比固定等待秒数更稳：推理快就快确认，推理慢也不会因为时间到了就误开。
initial_target_confirm_frames = 2
# 搜索候选先暂停当前小动作并观察连续两帧新鲜结果，再交回视觉跟随；
# 单帧候选只用于减速观察，不能改变搜索方向或认领 UID。
search_confirmed_reacquire_frames = 2

# 视觉接回后短时保留 UID。Depth 无效只能禁止前进，不能继续沿用丢失时的
# 冻结搜索方向；同一候选在这个窗口内只允许受限横向修正或停车。
visual_reacquire_hold_enable = true
visual_reacquire_hold_sec = 0.30
visual_reacquire_hold_max_center_jump_ratio = 0.30
visual_reacquire_hold_min_area_similarity = 0.45

# 检测器在 DeepSORT 输出轨迹之前只提供候选证据；方向只使用人体框几何，
# ReID 仅负责确认重新看到的是否为原目标。
# 该证据不写 ReID、不认领 UID、不直接进入纵向 PID。
search_evidence_gate_enable = true
# 同一次搜索最多重试一次：连续可信候选已被标记 observed 时，申请有界零速观察。
# 不放宽身份阈值，不授权前进或搜索换向；超时仍未确认就继续扫描。
search_evidence_retry_enable = true
search_evidence_hold_frames = 2
# 候选只用于让识别器看清，不等待完整编码器静止；到时必须继续搜索。
search_evidence_max_hold_sec = 0.30
search_evidence_probe_confirm_frames = 1
search_evidence_probe_min_score = 0.10
search_evidence_min_area_ratio = 0.01
search_evidence_max_area_ratio = 0.75
search_evidence_consistency_iou = 0.20
# An untracked search box is only a lateral hint until Tracker/ReID confirms
# it.  Keep weak detector-only boxes out of the aimline brake path: plants and
# furniture are common false person detections during a camera sweep.
search_candidate_untracked_min_score = 0.60
# 新鲜YOLO人体框距画面准心不足该比例时，进入候选接近旋转；
# 准心进入人体框后立即主动停车，不等待Tracker/ReID确认。
search_candidate_approach_margin_ratio = 0.08
# 搜索中只要看到有效人体候选，立即从搜索转速降到该接管转速。
# 低速接管给相机一个清晰观察窗口，候选短暂消失时不会立刻回到高速扫描。
search_candidate_acquire_raw_rpm = 7
# 丢失搜索使用短脉冲转动，在每个脉冲后给相机一个清晰观察窗口。
# 默认方向仍由历史队列提供；只有连续观察到活动 UID 的强 ReID 候选时才允许改侧。
# 脉冲本身只降低运动模糊，不改变搜索方向。
search_rotate_continuous_enable = false

# 丢失已经锁定的 ReID uid 后是否释放 target 并让画面最大框接管。
# false 表示持续只找原来的 uid；后续实体按钮/遥控按钮需要重新选人时，调用 clear_active_target。
release_target_on_lost = false

# 连续多少秒没有原目标才确认丢失并进入正式搜索；确认期间会按照目标最后
# 离开方向执行短促预转向。search_timeout_sec 始终从第一帧目标消失开始累计。
# release_target_on_lost=false 时仍只搜索原 uid，不允许最大框新人直接接管。
lost_confirm_sec = 0.0

# fallback：仅当 lost_confirm_sec = 0 时使用。连续 3 帧都没有原目标才确认丢失；
# 在当前约 10~15Hz 控制频率下约为 130~250ms，避免两帧 ReID 波动反复开搜索。
lost_confirm_frames = 3

# Keep acquisition order separate from inference completion order. Search
# direction is frozen only after fresh missing frames and an outward edge trace.
direction_history_enable = true

# Detector-only capture evidence can reconstruct a short lost-target timeline.
# It only supplies a bounded search-direction hint; it never writes DeepSORT,
# ReID templates, or historical motor actions.
historical_direction_backfill_enable = true
historical_direction_backfill_max_age_sec = 0.70
historical_direction_backfill_min_samples = 2
historical_direction_backfill_max_capture_gap = 6
historical_direction_backfill_max_center_jump_ratio = 0.30
historical_direction_backfill_min_area_similarity = 0.45
historical_direction_backfill_confidence_cap = 0.70
historical_direction_backfill_min_score = 0.20

# A stale detector/tracker result creates a blind interval. After loss
# confirmation, use capture-frame history for a single frozen search direction.
stale_direction_recovery_enable = true
stale_direction_observe_frames = 2
stale_direction_observe_max_sec = 0.20
stale_direction_settle_yaw_rate_dps = 3.0
stale_direction_probe_enable = false
stale_direction_probe_angle_deg = 12.0
stale_direction_probe_observe_frames = 2
stale_direction_probe_return_tolerance_deg = 2.0
stale_direction_probe_raw_target = 8

# 直行期间摄像头短暂漏检/ReID交接未完成时的安全保持参数。
# 上次可信距离必须大于 1.50 米，前红外、侧红外、近距刹车任一触发都会立即停车。
lost_forward_hold_rpm = 20
lost_forward_hold_max_sec = 0.35
lost_forward_hold_min_distance_m = 1.50
# Depth confidence policy: estimate for the first 200ms, cap forward motion at
# 20 RPM until 600ms, then stop longitudinal motion while visual centering stays active.
depth_medium_confidence_hold_sec = 0.60
depth_medium_confidence_rpm = 20
# A recovered far range cannot jump directly from stop to the PID's full output.
depth_recovery_stage1_sec = 0.20
depth_recovery_stage2_sec = 0.40
depth_recovery_stage1_rpm = 25
depth_recovery_stage2_rpm = 45

# 可见目标差速参数每个视觉帧都允许更新；动作层只在参数真正变化时替换指令，
# 不发送中间 STOP，使连续插值能及时跟上人物横向移动。
action_cooldown_frames = 1

# 微调后若视觉短暂漏检，保持方向但把前进基准限制为 15 RPM；第 5 帧必须停车。
steer_min_hold_sec = 0.25
steer_lost_hold_frames = 4
steer_lost_hold_max_sec = 1.0

[steering_pid]
# 可见人物跟随使用级联闭环：摄像头横向偏角是外环，ABZ 编码器反馈的
# 两轮实际 RPM 估算车身角速度并作为内环。丢失目标后的搜索旋转不走此 PID。
enable = true

# 当前摄像头有效水平视场按 60 度标定。最新日志中视觉结果年龄主要在
# 50~80ms；使用 130ms 会在人物尚未居中时过度扣除车身转角并提前反打。
camera_hfov_deg = 60.0
camera_latency_sec = 0.10
# 3度对应画面中心约 0.45~0.55，保证目标在 0.55~0.60 时仍有连续纠偏。
deadband_deg = 3.0

# 外环以当前目标位置决定唯一允许的转向方向；框中心速度只做单向辅助：
# 向画面外移动时提前加速，向中心返回时提前减速，不能越过当前位置反打。
# 实车静止目标回放显示 48 度/秒会在过中心后保留过多惯性。外环降低
# 峰值，主要由编码器内环负责快速制动，而不是持续把位置误差打满。
outer_kp_per_sec = 1.50
outer_kd_sec = 0.0
target_rate_feedforward_gain = 0.30
target_rate_feedforward_max_dps = 8.0
# 有连续框速度时，近中心最多比目标方位角速度快8度/秒；随现有小/大
# 误差带渐变，远离中心最多放到12度/秒。RPM上限、预测制动保持不变。
target_speed_match_max_closing_dps = 8.0
max_yaw_rate_dps = 35.0

# 内环：期望角速度与编码器估算角速度之差 -> 两轮 RPM 差修正。
# 增大 P 让编码器反馈更快抑制实际角速度过冲；I 只做小幅稳态补偿。
rate_kp_rpm_per_dps = 0.32
rate_ki_rpm_per_deg = 0.006
integral_limit_deg = 25.0
# 普通可见跟随的轮差上限。边缘框、深度短时跳变或目标左右晃动时，
# 不允许一次视觉帧把前进转向放大成原地甩尾。
max_correction_rpm = 10.0

# 动态转向：3 度外开始放宽，10 度以上允许完整横向修正。偏差较大时
# 更早把直行基准压到 20 RPM，避免纵向追赶速度过高而把目标甩出画面。
dynamic_small_error_deg = 3.0
dynamic_large_error_deg = 10.0
dynamic_small_max_yaw_rate_dps = 15.0
dynamic_small_max_correction_rpm = 5.0
dynamic_large_error_base_cap_rpm = 20.0

# 车身还在沿旧方向旋转、视觉已经要求反向时，清除旧积分并临时增加轮差。
# 人物进入约 x<0.20 / x>0.80 的边缘区域后，允许内轮降到 0 RPM，
# 外轮继续前进完成快速纠偏；目标仍可见时不会插入停车命令。
opposite_yaw_brake_threshold_dps = 3.0
opposite_yaw_brake_boost_rpm = 5.0
# Countersteer decelerates residual chassis yaw. Cap it below the normal
# tracking limit so a target crossing the center cannot cause a full reversal.
braking_max_correction_rpm = 5.0
fast_countersteer_max_correction_rpm = 5.0
fast_countersteer_gain_rpm_per_dps = 0.0
# 同方向角速度超出目标后发布 0 RPM 减速；人物仍在原侧时禁止反向驱动，
# 只有最新视觉位置真正越过中心后才允许反向制动。
same_direction_overspeed_threshold_dps = 4.0
same_direction_overspeed_brake_gain_rpm_per_dps = 0.35
# 当前目标在准心左/右侧时，任何计算得到的反向驱动都只能降为0RPM。
visual_direction_guard_enable = true
# 按实车日志估算约 50~80deg/s^2 的减速度。停车角同时包含视觉结果年龄
# 和约 50ms 的电机响应行程；减速度越小，撤掉驱动力越早。
predictive_brake_decel_dps2 = 60.0
predictive_brake_margin_deg = 1.25
predictive_brake_response_sec = 0.05
active_brake_yaw_threshold_dps = 7.0
active_brake_min_correction_rpm = 0.0
edge_boost_start_error_deg = 16.0
aggressive_inner_wheel_margin_rpm = 0.0

# 从静止开始出现明确的新方向时，先用3RPM克服启动迟滞；检测到首个
# 2deg/s编码器响应或100ms到期后立即退回连续PID（中心微调仍可用1RPM）。
startup_kick_error_deg = 0.0
startup_kick_rpm = 3.0
startup_kick_max_sec = 0.10
startup_kick_release_yaw_rate_dps = 2.0

# 电机实测可连续运行1RPM。中心带外的小量修正直接保持1RPM，不再抬高到5RPM。
min_effective_error_deg = 3.0
min_effective_correction_rpm = 1.0

# Depth 暂时缺距时只把前进限制为低速；横向轮差仍由视觉 PID 按误差
# 动态限制，当前缺距上限为 10 RPM。下发层不得再二次压成 3 RPM。
fallback_max_correction_rpm = 10.0
# YOLO 短暂漏检时只保持最后方向，轮差不得继续沿用边缘态的 14-18 RPM。
lost_hold_max_correction_rpm = 6

# 2026-08-18 实车融合标定结果。左/右分别保留，避免右转轮差不平衡被平均掉。
left_body_deg_per_encoder_deg = 0.5225
right_body_deg_per_encoder_deg = 0.5424

# 编码器反馈走同一个 RS485 锁，不会与电机写命令同时访问总线。
# 反馈超时后自动降级为只有摄像头的 PD，不使用旧编码器数据。
feedback_poll_interval_sec = 0.05
feedback_log_interval_sec = 0.50
# 连续3次编码器角速度取中值，过滤动作切换边界的单点高转速；真实持续旋转不丢失。
feedback_median_window = 3
feedback_stale_sec = 0.30
# 位置误差响应更快，D 项滤波更强，避免坏框/检测抖动被放大成反向修正。
error_filter_alpha = 0.60
derivative_filter_alpha = 0.12
fallback_base_rpm = 20

# 已到停车距离时不再复用搜索脉冲。摄像头角度外环和编码器
# 角速度内环逐视觉帧刷新原地居中力度。PID决定需要转向时至少下发 5 RPM，
# 偏差越大逐步增加，接近画面边缘时最多到 14 RPM；进入
# 0.45~0.55 中心范围停车，视觉心跳超过 0.25 秒也会安全停止。
# 候选接近阶段也使用这个最低转速；方向切换过渡仍由
# motion.rotate_pulse_transition_rpm 单独保持 4 RPM。
parked_recenter_min_rpm = 5
parked_recenter_max_rpm = 14
lost_hold_min_correction_rpm = 5

[lateral_intent]
# 视觉发布带时间戳的横向目标；独立循环在两帧之间用最新编码器反馈
# 刷新同一个PID。搜索、ReID确认、Depth纵向和安全停车不由此线程决定。
enable = true
control_rate_hz = 30.0
ttl_sec = 0.15
max_projection_sec = 0.0
max_projection_ratio = 0.0
# 向目标方向提速约每33ms最多5.3RPM；减速/换向更快，且换向必须经过0RPM。
rise_rpm_per_sec = 160.0
brake_rpm_per_sec = 280.0
# 电机目标最高20Hz刷新，诊断日志4Hz输出，避免串口和日志线程被30Hz淹没。
motor_publish_interval_sec = 0.05
# Sole normal-follow wheel writer; 0 restores legacy event-driven dispatch.
# Does not apply to search, reverse, or rotation-only. Safety revocations bypass the period.
follow_wheel_period_sec = 0.05
# 正常可见跟随、深度授权有效且两轮目标均不倒转时，残余单轮反转直接
# 交由电机控制器接续；不再额外插入停稳确认/5RPM爬坡。整车倒车、搜索、
# 反馈异常及安全撤销仍走原保护。false可回退原过零等待。
follow_forward_handoff_enable = true
log_interval_sec = 0.25

[track_memory]
# 已从 request_0513 主流程移除：目标保留/接回交给 DeepSORT + IdentityBank。
# 保留本段配置只是为了旧实验回看；当前代码不再用这层 Python target memory。
enabled = false

# 根据 [deepsort].max_unmatched_num 和 [vision].effective_fps 自动推导 memory_sec / allow_new_target_after_sec。
# 开启后，下面的 memory_sec 和 allow_new_target_after_sec 只作为关闭自动推导时的手动 fallback。
auto_from_deepsort = false

# 自动推导公式：
#   deepsort_hold_sec = max_unmatched_num / effective_fps
#   memory_sec = deepsort_hold_sec * memory_ratio
#   allow_new_target_after_sec = deepsort_hold_sec + allow_new_extra_sec
# memory_sec 只用于短时同 ID/可选几何找回窗口；真正允许接管新人要等 allow_new_target_after_sec。
memory_ratio = 0.75
allow_new_extra_sec = 0.5

# 手动 fallback：仅当 auto_from_deepsort = false 时使用。
memory_sec = 1.2
allow_new_target_after_sec = 2.0

# 只允许 DeepSORT/ReID 给出的同 stable_id 自动接回；建议保持 true。
reacquire_same_id = true

# 只在短记忆窗口内启用，并且需要连续确认，避免 uid 短暂抖动时马上切目标。
reacquire_by_geometry = true

# 仅在 reacquire_by_geometry = true 时生效，表示几何候选要连续确认多少帧才接回。
reacquire_confirm_frames = 2
max_center_jump_ratio = 0.6
min_area_similarity = 0.35
max_aspect_diff = 0.90
log_enable = true

[deepsort]
# 这一组参数才是真正决定 ReID/DeepSORT 记住目标多久、是否容易换 ID 的核心。
# Python 的 track_memory 已关闭，所以换人/保留主要由这里和 C 侧 tracker 输出决定。

# 目标允许连续未匹配的最大次数；越大越能短暂记住同一个 TrackID，越小越快丢弃旧目标。
# 当前 effective_fps=3.3 时，20 大约是 6.06s。目标绕到侧面/短遮挡时可以保留更久；
# 但如果多人频繁抢目标，过大也会让旧目标残留太久。建议先在 15-20 区间试。
max_unmatched_num = 20
# 实时小车控制不吃补帧框；这里也不再输出补帧 track，减少控制滞后。
# 若离线分析需要看预测框，可临时调回 1-5，并打开 [vision].control_use_predicted_tracks。
max_output_age = 0

# 新目标需要连续稳定匹配多少次才进入可信跟踪；越大越抗误检，越小越快接管新出现的人。
# 建议：一般用 2-4；想让车更快跟上新目标可用 2；误检多或多人穿插时用 3-5。
accreditation_threshold = 2

# 目标短暂丢失后，仍允许用 bbox/IoU 几何位置做补充匹配的未匹配次数。
# 建议：一般用 1-3；多人交叉时用 1-2 更稳；单人遮挡恢复能力不够时可用 3-5。
max_unmatched_times_for_bbox_matching = 2

# bbox/IoU 匹配的最大距离阈值，通常可理解为 1 - IoU；越小要求框重叠越高。
# 建议：0.50-0.70；多人近距离交叉时用 0.45-0.60；转向/画面抖动较大时用 0.60-0.75。
max_distance_iou = 0.60

# ReID 特征的余弦距离阈值；越小越严格，越大越容易把相似的人接成同一个 ID。
# 建议：0.30-0.40；多人场景优先 0.30-0.35；单人跟随但容易断 ID 时可试 0.38-0.45。
max_distance_cosine = 0.40

# 每个 TrackID 保留的历史 ReID 特征数量；越大越能覆盖姿态变化，但也更可能保留过旧特征。
# 当前为严格锁人倾向，先用 15；多人频繁交叉且误关联变多时，可降到 8-12。
feature_budget_size = 15

# 每隔多少次匹配更新一次 ReID 特征；越小更新越快，越大越保守。
# 建议：2-5；目标外观变化明显时用 2-3；担心误更新到别人身上时用 4-6。
feature_update_interval = 5

# 与板子 followme DeepSORT 默认一致：低于该检测置信度不进入跟踪。
min_confidence = 0.50

# 跟踪前对检测框再做一次 NMS，减少重复框影响关联。
nms_max_overlap = 0.50

# 与 followme 的 expand_bbox_xyxy(scale=1.2) 对齐，裁剪 ReID 时略放大人体框。
bbox_expand_scale = 1.20

[identity_bank]
enabled = true
match_threshold = 0.38
match_margin = 0.03
update_threshold = 0.30
update_interval = 5
max_features = 20
# 低质量但仍有有效人体外观的侧身/贴边框进入独立弱库，绝不挤掉强特征锚点。
max_weak_features = 8
# 容量保持 20 条：跳过高度重复模板；满库后仅用明显更有差异的新模板替换
# 非锚点中的冗余模板。首条稳定特征始终保留，避免图库随时间漂移。
diversity_min_distance = 0.02
diversity_replace_margin = 0.01
# 弱特征只辅助已有身份。距离附加质量惩罚，搜索时至少连续 2 帧确认；
# 确认帧仍输出 UID 0，等框恢复为高质量后才允许控制层接管。
weak_update_threshold = 0.42
weak_update_interval = 3
weak_match_penalty = 0.10
weak_reacquire_threshold = 0.38
weak_reacquire_confirm_frames = 2
weak_quality_weight = 0.30
min_confidence = 0.60
# Raw YOLO pixels (current RGB 640x480), BEFORE DeepSORT expansion.
# Shared by identity and formal/probe search admission; rejected boxes remain
# in raw video/log diagnostics, but cannot start ReID or observation holds.
# This deliberately excludes distant/tiny people from the near-follow domain.
min_area = 3072
min_width_px = 32
min_height_px = 80
# A real person cannot lose more than 70% of bbox area in one or two frames.
# Keep the last reliable area as the baseline so repeated tiny fragments remain rejected.
max_single_frame_area_shrink_ratio = 0.30
area_shrink_max_gap_frames = 2
# Track identity must not jump across more than 30% of the image within two
# fresh updates. Such jumps are typical when two people cross and DeepSORT
# swaps their raw track boxes; reject the identity for this frame and wait for
# controlled ReID handoff instead of steering at the wrong person.
max_center_jump_ratio = 0.30
center_jump_max_gap_frames = 2
swap_min_mapped_jump_ratio = 0.08
swap_max_replacement_distance_ratio = 0.12
# bbox 几何质量门控：只限制长期 ReID bank 的创建/匹配/更新，不影响当前 tracker 框输出。
# 主要用于挡住手遮挡、贴边超大框这类 YOLO 误检，避免污染 uid 的历史特征。
max_area_ratio = 0.75
max_width_ratio = 0.85
max_height_ratio = 1.00
min_aspect_ratio = 0.18
max_aspect_ratio = 1.45
max_edge_touch_count = 2
edge_margin_ratio = 0.02
# 短遮挡/短丢失后的接回窗口。普通新 track 匹配仍使用 match_threshold。
# 单候选用较宽接回阈值；多人候选也允许接回，但必须满足下面更严格的距离和 margin。
reacquire_threshold = 0.60
reacquire_max_frames = 90
reacquire_margin = 0.08
reacquire_single_candidate_only = true
reacquire_multi_candidate_enable = true
reacquire_multi_candidate_threshold = 0.45
reacquire_multi_candidate_margin = 0.12
# 已有 bank 后，新 uid 需要连续确认几帧才创建，避免遮挡刚回来时马上宣布 uid2。
new_identity_confirm_frames = 2
# 已经映射过的 DeepSORT track 也要用 ReID 距离复核；避免 raw track_id 被错误延续时，
# 旧 uid 被直接传给控制层。注意这里不改普通 match_threshold。
mapped_verify_enable = true
mapped_verify_threshold = 0.45
# bbox 贴边/过大等质量差时，保留内部映射但本帧不给控制层输出旧 uid。
mapped_bad_quality_returns_unassigned = true
# 同一个 uid 在短窗口内只能被一个 raw track 占用；新 track 即使 ReID 距离过线，
# 如果旧 track 刚刚还在，就先不接过去，防止两个人同时变成 uid=1。
exclusive_uid_claim_enable = true
exclusive_uid_claim_frames = 15
# 新 raw track 想接管旧 uid 时，需要 ReID 匹配连续确认，避免 ID 漂移后误接目标；默认连续 2 帧。
controlled_handoff_enable = true
controlled_handoff_confirm_frames = 2
# Single-frame handoff also requires recent, consistent UID-level geometry.
controlled_handoff_instant_threshold = 0.15
controlled_handoff_threshold = 0.30
controlled_handoff_min_old_track_gap_frames = 5
# Raw-track changes do not reset the locked UID's geometry reference.
handoff_geometry_max_gap_frames = 15
handoff_geometry_max_center_jump_ratio = 0.30
handoff_geometry_min_area_similarity = 0.35
# 搜索阶段只对原锁定 UID 启用的定向接回：候选必须从搜索方向出现，
# 与原 UID 的距离不超过 0.20，且最多只允许比全局最佳 UID 差 0.05。
# 同一条连续的视觉链连续确认 2 帧后才真正交接；短暂换 raw track 需位置连续。
preferred_search_reacquire_enable = true
preferred_search_reacquire_threshold = 0.20
preferred_search_reacquire_max_disadvantage = 0.05
# 搜索接回专用的检测置信度下限。仅在活动 UID、当前搜索且框几何有效时使用；
# 普通跟随、新 UID 创建和身份库更新仍使用 min_confidence。
preferred_search_reacquire_min_confidence = 0.50
# 搜索态仅用于 ReID 观察的大人体框最低置信度；仅走 weak 两帧确认，
# 不改变普通跟踪、前进控制或身份库更新门槛。
preferred_search_reacquire_observation_min_confidence = 0.25
preferred_search_reacquire_max_age_sec = 0.35
# 旧锚点过期后，候选先做连续两帧本地观察，不直接继承 UID。
preferred_search_reacquire_late_candidate_enable = true
# 普通搜索候选连续 2 帧确认；距离 <= 0.15 的高质量强匹配允许单帧确认。
preferred_search_reacquire_confirm_frames = 2
preferred_search_reacquire_instant_threshold = 0.15
# 多个检测框时，当前候选至少比次佳人体框高 0.25 才视为低质量碎片不构成竞争；
# 分数接近的候选仍按多目标保护处理。
preferred_search_reacquire_min_score_gap = 0.25
# Strict gate remains unchanged; soft candidates only enter a two-frame
# observation chain and can never bind a UID on their first frame.
preferred_search_soft_candidate_enable = true
preferred_search_soft_candidate_threshold = 0.30
preferred_search_soft_min_score_gap = 0.15
preferred_search_soft_min_area_ratio = 0.25
preferred_search_soft_min_confidence = 0.80
preferred_search_reacquire_side_ratio = 0.05
# 可见躯干外观分支：只用于贴边/近距离候选接回，不放宽全身 ReID 门槛。
partial_appearance_enable = true
partial_match_threshold = 0.34
# 晚到候选若已满足唯一候选、同一轨迹连续帧和全身 strong d<=0.20，
# 躯干聚合只作为诊断，不得清除全身确认链；partial-only 仍使用上面的阈值。
partial_max_features = 8
partial_update_threshold = 0.30
# 重叠人体框去重只阻止尚未映射的碎片框创建新 UID，不删除视觉轨迹，
# 已经映射 UID 的轨迹也永远不会被该规则压掉。
duplicate_box_suppression_enable = true
duplicate_iou_threshold = 0.55
duplicate_vertical_overlap_threshold = 0.88
duplicate_horizontal_overlap_threshold = 0.40
duplicate_large_height_ratio = 0.80
duplicate_large_width_ratio = 0.45
duplicate_max_area_ratio = 0.65
duplicate_bottom_gap_ratio = 0.10
# 如果同一帧多个 raw track 输出同一个 reid_uid，则本帧把这些 uid 都置 0，
# 让控制层进入丢失/搜索，而不是选最大框继续跟错人。
suppress_duplicate_uids = true

[predicted_reid]
# 实时控制不再消费补帧框，因此关闭补帧 ReID 二次验证，避免每个预测框额外跑一次 ReID。
verify_enable = false
verify_threshold = 0.30
duplicate_iou_threshold = 0.30
duplicate_overlap_threshold = 0.45

[mmwave_match]
# 毫米波规格信息：
#   检测盲区约 0.5-1m；距离精度约 0.15m；角度精度约 2-20deg；
#   方位角检测范围约 +/-60deg；正面运动目标最远约 10m。
#
# vision_mmwave 匹配逻辑：
#   1. 先由视觉/ReID 锁定人；
#   2. 用视觉目标中心和 hfov_deg 估算目标方位角；
#   3. 只选角度接近该目标的人体毫米波点作为距离；
#   4. 没有视觉目标时，不用毫米波鬼影驱动车跟随。
#
# 柱子/多人场景不要简单“前方有毫米波点就停”；应优先看点是否落在目标角度或车辆通道内。
# 完整通道判断后续还要加入车宽、车长、安全边距和偏航角投影，目前这些尚未接入控制代码。

# 视觉目标角度和毫米波角度允许的匹配窗口。毫米波角度误差约 +/-5deg，
# 实车还有相机/雷达安装误差和人左右摆动，建议先用 10-15deg。
angle_margin_deg = 12.0

# 安装偏差修正。若视觉正中人总匹配到毫米波 +N 度，可把 angle_offset_deg 调成 -N。
angle_offset_deg = 0.0

# AT2410 实测：小车左侧为正角度、右侧为负角度；视觉 x 轴左侧为负，所以这里取 -1。
angle_sign = 1.0

# angle 表示优先按角度匹配视觉目标；不建议改成 nearest，避免柱子/旁人距离更近时抢匹配。
match_mode = angle
# 当两个毫米波点和视觉中心角度差非常接近时，优先取更近的点，避免宽 bbox 把远处旁边点匹配进来。
# 0 表示完全按角度最近；实车目前先用 6deg 抑制 2m/4m 之间的跳档。
angle_tie_margin_deg = 2.0

# 距离偏置修正。AT2410 当前先使用原始距离；若系统性比实际远 5cm，用 0.05。
distance_bias_m = 0.0

# 低于该距离的毫米波点不可信或不可用。AT2410 安装说明给出的检测盲区约 0.5-1m。
min_distance_m = 0.50

# 超出该距离的点不参与跟随距离控制。
max_distance_m = 10.0

# 输出距离的下限保护，避免滤波/偏置后出现 0 或负值。
min_output_distance_m = 0.03

# 过近硬停结果的保持时间，避免毫米波偶发丢点后立即释放。
hard_stop_ttl_sec = 0.30

# AT2410 输出相对真实目标约有 100ms 延迟；这里从毫米波缓存里取接近该延迟的样本，
# 让视觉 bbox 角度和毫米波点更接近同一时刻。若后续日志 sample_age 偏大/偏小再微调。
latency_sec = 0.13
cache_max_age_sec = 0.20
use_async_cache = true

# 同一 ReID 人物仍清晰可见、且上次可信距离大于 1.40 米时，毫米波偶发失配不立即停车。
# 最多沿用上次可信距离 2.50 秒，覆盖实测最长约 2.4 秒的失配；期间仍使用低速上限。
# 计时不会因连续失配而刷新；近距离和超时后仍会停车，不能用旧距离解除停车锁存。
unmatched_hold_sec = 2.50
unmatched_hold_min_distance_m = 1.40

# 2.50 米以上人体框角度较窄，给同一条已确认雷达轨迹额外增加 4 度匹配余量。
# 该余量不会放宽下面的 26 度中心角上限，也不会绕过角度/距离连续性校验。
far_margin_start_m = 2.50
far_angle_margin_extra_deg = 4.0

# 毫米波点必须靠近“同一时刻”的视觉人物中心。实车日志表明 20 度门限误拒过多，
# 现放宽到 26 度；原先 -6 -> -36 度的约 30 度错配仍会被拒绝，远点还需三帧确认。
max_center_angle_diff_deg = 26.0

# 已匹配目标的距离突然变远超过 0.60 米时，不立即换绑；同一个新候选连续 3 帧才确认。
# 确认期间距离无效，控制器会停车观察。突然变近不等待，优先保证防撞。
max_distance_jump_m = 0.60
switch_confirm_frames = 3

# 连续性评分同时参考：视觉中心角差、上一毫米波角差、上一距离差。
# max_angle_jump_deg 用于优先保留原雷达轨迹；distance_score_weight 越大越不容易跳到远点。
max_angle_jump_deg = 15.0
distance_score_weight = 6.0

# 关联记忆与失配保持时间一致，避免 0.8 秒后把旁边的新雷达点当成当前人物。
continuity_memory_sec = 2.50

# 距离融合：毫米波提供绝对距离锚点；同一 ReID 人物的框高度估算短时相对距离，
# 编码器 RPM 只做小幅车体位移预测。融合结果仍交给 1.50m 距离锁存和红外硬停。
fusion_enable = true
fusion_radar_median_window = 3
fusion_visual_weight = 0.80
# 用户实测轮径26cm：pi*0.26=0.816814m/圈。假设驱动反馈为输出车轮RPM；需独立位移复核。
fusion_encoder_wheel_circumference_m = 0.816814
fusion_encoder_max_step_m = 0.12
fusion_bbox_min_height_ratio = 0.08
# 允许接近画面底部的正常框参与短时视觉估距；满屏 1.00 框仍会被过滤。
fusion_bbox_max_height_ratio = 0.99
# 毫米波恢复时只平滑“变远”方向；突然变近仍立即采用，优先安全停车。
fusion_radar_recovery_alpha = 0.35
fusion_max_distance_increase_mps = 2.0
fusion_min_confidence = 0.40

# 雷达角度变化只保留为日志诊断，不参与左右转向或搜索方向决策；
# 下面参数仅控制诊断历史的灵敏度和保留时间。
motion_min_angle_delta_deg = 3.0
motion_hint_ttl_sec = 0.80

# 每隔多少帧打印一次毫米波匹配日志；排查角度/距离时可以调小。
log_every_frames = 10

[motion]
# 速度策略：
#   - 没有毫米波距离时，base = [distance].fallback_forward_percent。
#   - 有 vision_mmwave 距离时，base 由下面距离档位决定。
#   - 目标在画面内但偏左/偏右时，使用同向前进的左右轮 raw 速差修正；
#     真正丢人进入 search 后才使用原地 TURN。
# 正常匹配和毫米波短时 hold 都使用 1.5-5m 连续曲线；hold 只限制最高
# 速度，不再固定回落到 15 RPM。完全没有可用距离时才使用低速兜底。
min_forward_percent = 20
max_forward_percent = 100
# 毫米波处于短暂失配保持期时，继续按最后可信距离追赶，最高限制为
# 前进上限的 80%，即当前配置下最多约 40 RPM。
mmwave_hold_forward_percent = 80
# 从可信距离进入短暂 hold 时，每个视觉帧最多降低 4%；恢复匹配时每帧最多增加 6%。
# 距离过近、红外和其他安全停车不经过此平滑，仍会立即 STOP。
mmwave_hold_decel_step_percent = 4
mmwave_hold_recover_step_percent = 6
# 融合置信度下降时，hold 速度上限从 80% 平滑降至该值，绝不替代近距离/红外硬停。
mmwave_fusion_low_confidence_forward_percent = 60
# 轮差 steer 的外侧轮独立百分比上限，最终仍受 50 rpm 硬限幅。
steer_percent_limit = 88

# 纵向 PID 的输出限幅：目标距离误差经 [distance_pid] 外环计算后，
# 前进输出限制在 20~200 RPM（上限不是固定速度）；近距离Depth仍限制20RPM。
forward_min_rpm = 20
forward_max_rpm = 200
forward_curve_max_distance_m = 5.0
forward_curve_exponent = 0.75

# 以下旧分档变量保留兼容旧脚本，当前 FollowSafetyController 默认使用距离 PID。
forward_speed_le_1_3_percent = 72
forward_speed_le_1_7_percent = 75
forward_speed_le_2_1_percent = 79
forward_speed_le_2_6_percent = 83
forward_speed_le_3_2_percent = 87
forward_speed_le_3_8_percent = 91
forward_speed_le_4_5_percent = 94
forward_speed_far_percent = 72
# 原地搜索参数：中低速短脉冲后保持同方向低速过渡，避免每个脉冲都
# 清零并等待很长 settling，导致搜索几乎不转。换向、安全停车或目标
# 重新接管时仍会强制清零。
# 这些参数只用于人物真正丢失后的搜索，不影响画面内的连续差速 PID。
rotate_duration = 0.18
rotate_pulse_brake_enable = true
rotate_pulse_stop_mode = zero
# 搜索脉冲结束后以 4 RPM 同方向过渡，只跨过一个新鲜观察帧；必要时
# settle gate 仍会处理异常反馈，安全停车和换向仍为 0 RPM。
rotate_pulse_pause_sec = 0.00
rotate_pulse_observe_min_frames = 1
rotate_pulse_settle_enable = true
rotate_pulse_settle_quiet_sec = 0.05
rotate_pulse_settle_timeout_sec = 0.18
rotate_pulse_settle_feedback_stale_sec = 0.30
rotate_pulse_settle_max_wheel_rpm = 5
rotate_pulse_settle_max_yaw_rate_dps = 10.0
# rotation-only 模式下搜索脉冲结束时做低强度反向制动；普通跟随模式
# 使用下面的同方向过渡，目标出现或换向时仍然立即清零。
rotate_pulse_active_brake_enable = true
rotate_pulse_active_brake_rpm = 4
rotate_pulse_active_brake_sec = 0.08
# Same-direction search handoff RPM. This keeps the chassis moving through the
# one-frame observation handoff; safety STOP, target reacquisition, and
# direction changes still use 0 RPM.
rotate_pulse_transition_rpm = 4
rotate_hold_stale_sec = 0.25
# 下面两个百分比仅在对应 raw RPM 参数设为 0 时生效；搜索阶段使用 raw RPM，
# 可见近距离原地修正优先走 steering PID，raw visible 仅作为 PID 不可用时的兜底。
rotate_turn_percent_from_forward = 15
rotate_turn_percent_chain = 10
# 原地 TURN 的实际旋转力（单位 RPM），按场景分别设置：
# visible：人还可见但贴近画面边缘；search：视觉连续确认丢失后的扫描。
# lost_wait 保留兼容旧日志，当前确认窗口只保持低速 steer 或停车，不再提前原地旋转。
# visible=10：PID 不可用时人物仍可见的低速兜底；search=7：完全丢失后的搜索脉冲。
# 设为 0 时沿用 [motor].rotate_raw_target。
rotate_raw_target_visible = 10
rotate_raw_target_lost_wait = 14
# 无候选时采用 7 RPM + 180ms 搜索，脉冲间以 4 RPM 过渡；可信候选重试为 0 RPM。
rotate_raw_target_search = 7

# 轻微、普通、强三个控制点会按人物横向误差和外移速度连续插值；
# 正常可见跟随的最终轮差不超过 10 RPM，搜索阶段使用独立上限。
visible_steer_fine_inner_ratio_percent = 90
visible_steer_fine_outer_ratio_percent = 100
visible_steer_inner_ratio_percent = 80
visible_steer_outer_ratio_percent = 105

# 目标偏出中心且继续向外移动时使用更大的倍率差，便于更快把人拉回中心。
visible_steer_strong_inner_ratio_percent = 70
visible_steer_strong_outer_ratio_percent = 110

# 左右各 20% 外侧区域才使用强差速；最外侧 15% 切换原地旋转。
visible_steer_strong_margin_ratio = 0.20

# 连续居中轨迹预测参数：使用最近 4 帧，在接近 43%/57% 边界时提前介入。
# 反向保护仍要求人物接近对应边界，不能从画面中心直接反向强修。
visible_motion_history_frames = 4
visible_motion_lookback_sec = 0.10
visible_motion_rate_filter_alpha = 0.70
visible_motion_min_ratio = 0.015
visible_motion_projection_gain = 0.75
visible_motion_strong_ratio = 0.05
# brake 保持态不需要高频重复 normal_stop。太频繁会挤占 RS485，
# 现场已见到“响应过短”；这里控制保持态重复 stop 的间隔。
brake_hold_refresh_sec = 1.2

[motor]
backend = rs485_lz30ema
# Percent-mode upper bound. DRIVE/TURN are currently raw-limited below;
# STEER is a legacy wheel-differential path and is not generated by the follow controller.
# set a raw target to 0 if that action needs to fall back to percent tuning.
percent_limit = 100
rs485_port = /dev/ttyS0
rs485_slave_id = 1
rs485_baudrate = 115200
rs485_timeout = 0.15
# LZ-30EMA_2EC_N library root; the adapter resolves its src/ package.
rs485_lib_dir = /home/topeet/lianzhan
# 驱动器/电机组合的绝对能力上限，单位 RPM。它只负责最终保护；实际
# DRIVE最大200RPM；REVERSE仍受独立60RPM限制，TURN仍用场景固定RPM。
rs485_max_target = 200
# 临时低速落地测试：纯前进 DRIVE 直接写 LZ30EMA RPM target。
# 设为 0 时恢复 percent * rs485_max_target / 100 的百分比换算。
forward_raw_target = 0
# DRIVE、REVERSE 和可信距离下的差速 STEER 独立转速上限。
forward_max_target_rpm = 200
# 直行目标变化不足 5 RPM 时保持上一目标，不重新写入；达到 5 RPM 才更新。
# 漏检或毫米波短失配触发的安全降速不受该滞回限制，会立即降到 20 RPM。
forward_update_min_delta_rpm = 5
# 轮差 STEER 的异常保持基准为 15 RPM。可信毫米波距离存在时，STEER 会使用
# 20-100 RPM 距离 PID 作为前进基准，再叠加小轮差；距离异常时仍回落到该 15 RPM。
# 设为 0 时恢复旧百分比换算。
steer_raw_target = 15
# 未匹配到 visible/lost_wait/search 原因时，原地 TURN 使用的兜底转速（单位 RPM）。
# 设为 0 时才会改用 rotate_turn_percent_* 百分比换算。
rotate_raw_target = 18
left_sign = -1
right_sign = 1
# 全局前进方向符号。换电机后若 forward 实际后退，先只翻这个值；
# left_sign/right_sign 是单轮安装方向，不要和这个一起盲目修改。
forward_target_sign = -1
# 跟随程序启动时写入左右电子驻车电流，退出时持久写回 0A。
parking_current_a = 5.0
# 兼容旧配置字段；LZ30EMA 运行期间不会因运动命令自动清除驻车电流参数。
exit_parking_mode_on_arm = false
stop_mode = normal
# Stop sequence follows the standalone motor_direction_control_new.py smoke
# script: set both wheel targets to 0 first, wait briefly, then send stop.
# stop_zero_delay_sec 是“单次 stop 命令内部”的清零等待时间。
stop_zero_delay_sec = 0
# 运动动作切换时先急停再写新目标，避免 RS485 分两次写左右轮时出现
# “一个轮已切换、另一个轮还保持旧目标”的中间态。
transition_stop_mode = emergency
# 切换动作时可执行“目标清零 + emergency stop”，中间留出稳定时间；
# 0 表示不插入切换急停，1/2 表示插入对应次数。
# transition_stop_delay_sec 是每次 transition stop 之后的额外间隔，不替代 stop_zero_delay_sec。
transition_stop_delay_sec = 0
transition_stop_repeat = 0
# 动作线程 10ms 循环；target_min_interval_sec 限制 rotate pulse 模式下重复刷新 TURN 目标的最小间隔。
target_min_interval_sec = 0.05
# forward/steer 保留低频保活，但从 100ms 放宽到 500ms，减少相同目标反复写寄存器。
forward_like_keepalive_sec = 0.50
m1_is_left_wheel = false

[safety]
# 左右红外需连续触发 0.10 秒才确认，排除单次毛刺；确认后需连续清除 0.20 秒才释放。
# 前红外不经过该滤波，仍然在第一次读取到障碍时立即硬停。
side_ir_confirm_sec = 0.10
side_ir_release_sec = 0.20

# 前红外负责立即急停；左右红外经过短时确认后参与转向安全门。
side_ir_blocks_rotation = true

# 找人/可见目标原地旋转默认不受前红外限制：前红外只禁止 forward/steer。
# 如果机械结构或场地要求“前红外触发时连原地旋转都禁止”，再改 true。
search_rotate_front_block_enable = false
# 距离 brake_latched/小于 brake_distance_m 时仍禁止原地旋转，避免近距离扫向人/墙。
search_rotate_distance_block_enable = true

# 任一方向被安全门拦截时保持停车，不把受阻转向改写成前进动作。

# 相同 stop 原因已经停住时，直接 stop 指令的最小重复间隔。
# brake_hold_refresh_sec 负责安全保持，这里用于避免每一帧都挤占 RS485。
direct_stop_repeat_interval_sec = 0.75

# 未来通道判断需要的实测参数（当前尚未接入代码，先作为测量记录）：
#   vehicle_width_m  : 车体最宽处，建议量左右轮外侧到外侧。
#   vehicle_length_m : 车头到车尾。
#   side_margin_m    : 每侧安全边距，室外低速建议 0.10-0.15m。
# 斜着通过时需要通道宽度约为：
#   width*cos(yaw_error) + length*sin(yaw_error) + 2*side_margin
# yaw_error 可先用视觉目标角度绝对值近似。

[bunker]
mode = off
