[modules]
# 视觉主要是人
vision = true
# 红外
ir = true
# 毫米波
mmwave = true
# 超声
ultrasonic = false
# 沙坑
bunker = false

[ir]
backend = iio
trigger_value = 0
iio_base_dir = /sys/bus/iio/devices
iio_right_device = 4
iio_left_device = 3
iio_front_device = 5
raw_log_enable = true
raw_log_every_sec = 0.50

[vision]
engine = rknn
reid_enable = true
model_path = models/yolo11s.rknn
reid_model_path = models/osnet_x0_5_msmt17_combineall_b1.rknn
rknn_target = rk3588
rknn_core_mask = auto
input_size = 640
num_classes = 80
reid_input_width = 128
reid_input_height = 256
reid_input_format = RGB
reid_input_dtype = float32
reid_input_layout = NCHW
person_class_id = 0
confidence_threshold = 0.25
target_select = largest_area

[deepsort]
max_unmatched_num = 20
max_output_age = 5
accreditation_threshold = 3
max_unmatched_times_for_bbox_matching = 2
max_distance_iou = 0.60
max_distance_cosine = 0.35
feature_budget_size = 15
feature_update_interval = 3
min_confidence = 0.50
nms_max_overlap = 0.50
bbox_expand_scale = 1.20

[identity_bank]
enabled = true
match_threshold = 0.32
match_margin = 0.03
update_threshold = 0.30
update_interval = 5
max_features = 20
min_confidence = 0.65
min_area = 0.0
max_area_ratio = 0.75
max_width_ratio = 0.85
max_height_ratio = 1.00
min_aspect_ratio = 0.18
max_aspect_ratio = 1.45
max_edge_touch_count = 2
edge_margin_ratio = 0.02
reacquire_threshold = 0.50
reacquire_max_frames = 90
reacquire_margin = 0.08
reacquire_single_candidate_only = true
reacquire_multi_candidate_enable = true
reacquire_multi_candidate_threshold = 0.40
reacquire_multi_candidate_margin = 0.12
new_identity_confirm_frames = 2

[distance]
source = mmwave
target_distance_m = 1.0
brake_distance_m = 0.5
mmwave_obstacle_threshold_m = 1.0

[motion]
min_forward_percent = 10
max_forward_percent = 20
forward_speed_le_1_3_percent = 10
forward_speed_le_1_7_percent = 12
forward_speed_le_2_1_percent = 14
forward_speed_le_2_6_percent = 16
forward_speed_le_3_2_percent = 18
forward_speed_le_3_8_percent = 20
forward_speed_le_4_5_percent = 20
forward_speed_far_percent = 20
rotate_duration = 0.35
rotate_turn_percent_from_forward = 20
rotate_turn_percent_chain = 20
brake_hold_refresh_sec = 0.10

[motor]
backend = rs485_lz30ema
percent_limit = 20
rs485_port = /dev/ttyS0
rs485_slave_id = 1
rs485_baudrate = 115200
rs485_timeout = 0.3
# LZ-30EMA_2EC_N library root; the adapter resolves its src/ package.
rs485_lib_dir = /home/topeet/lianzhan
# Maximum wheel speed used by percent mode, in RPM.
rs485_max_target = 100
left_sign = -1
right_sign = 1
forward_target_sign = -1
stop_mode = normal
m1_is_left_wheel = false

[bunker]
# off(关闭), split(分开的模型), merge(共用一个模型)
mode = off
workdir = ./yolov8-track
model_path = ./yolov8-track/shakeng_yolov8n_cv181x_int8_640_compat12.cvimodel
class_ids = 0,1
class_names = 0:bunker,1:pond
score_threshold = 0.0
area_ratio_stop = 0.05
sample_det_conf = 0.75
get_frame_timeout_ms = 200
loop_period_ms = 100
active_hold_sec = 0.35
stop_consec_frames = 2
echo_raw = false
sample_binary = ./sample_personv8_track
